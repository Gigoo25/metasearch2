version: '3.7'

services:
  metasearch2:
    build:
      args:
        CONFIG: "/usr/local/bin/config.toml"
      context: .
      dockerfile: Containerfile
    network_mode: "host"
    volumes:
      # drop ZIM archives here (e.g. produced by zimit)
      - ./zim:/zim:ro
      # search cache and kiwix library; survives container restarts
      - metasearch-cache:/cache
    restart: unless-stopped

volumes:
  metasearch-cache:
