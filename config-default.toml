# See src/config.rs for all of the possible options.
# The commented-out lines are examples of values you could set, not the defaults.

bind = "0.0.0.0:28019"
api = false

[ui]
# engine_list_separator = true
# show_version_info = true
# stylesheet_url = "/themes/catppuccin-mocha.css"
# favicon_url = "data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgMzIgMzIiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMTEiLz48L3N2Zz4="

[image_search]
# enabled = true

[engines]
# numbat = false
# fend = true
# kiwix = true

# optional: offline full-text search through a local kiwix-serve instance
# (https://github.com/kiwix/kiwix-tools). The url must be reachable from both
# the server and your browser.
[engines.kiwix]
# enabled = true
# url = "http://127.0.0.1:8080"
# book = "" # restrict search to one book by its kiwix name; empty means all books
# page_length = 25

[cache]
# enabled = false
# dir = "" # empty means $XDG_CACHE_HOME/metasearch or ~/.cache/metasearch
# fresh_ttl_secs = 600 # serve cached results without contacting any engines
# stale_ttl_secs = 604800 # serve cached results when every engine fails
# max_entries = 256

[urls.replace]
# "www.reddit.com" = "old.reddit.com"
# "medium.com" = "scribe.rip"
# ".medium.com" = "scribe.rip"

[urls.weight]
# These are checked after applying replacements. Setting the weight to 0 (or any
# negative number) completely hides the result. Longer matches have a higher
# priority.
# "quora.com" = 0.1
# ".quora.com" = 0.1
